# Penpot overlay（RTG-03 / T015a）
# 用法（在 infrastructure/docker 目录）:
#   docker compose -f docker-compose.yml -f docker-compose.penpot.yml up -d
#
# 镜像版本锁定；plugins runtime 须在 backend 环境开启。
# 官方参考: https://github.com/penpot/penpot/tree/main/docker

services:
  penpot-frontend:
    image: penpotapp/frontend:2.4.3
    ports:
      - "9002:80"
    depends_on:
      - penpot-backend
      - penpot-exporter
    environment:
      PENPOT_FLAGS: enable-registration enable-login-with-password enable-plugins-runtime
    networks:
      - canvory_net

  penpot-backend:
    image: penpotapp/backend:2.4.3
    depends_on:
      - postgres
      - redis
    environment:
      PENPOT_FLAGS: enable-registration enable-login-with-password enable-plugins-runtime
      PENPOT_DATABASE_URI: postgresql://canvory:canvory@postgres:5432/penpot
      PENPOT_REDIS_URI: redis://redis:6379/1
      PENPOT_HTTP_SERVER_PORT: 6060
      # CORS / 插件静态站：按部署域名调整
      PENPOT_PUBLIC_URI: http://localhost:9002
    networks:
      - canvory_net

  penpot-exporter:
    image: penpotapp/exporter:2.4.3
    depends_on:
      - penpot-backend
    environment:
      PENPOT_PUBLIC_URI: http://localhost:9002
      PENPOT_REDIS_URI: redis://redis:6379/1
    networks:
      - canvory_net

networks:
  canvory_net:
    driver: bridge
