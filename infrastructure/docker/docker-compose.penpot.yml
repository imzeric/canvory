# Penpot overlay（RTG-03 / T015a）
# 用法（在 infrastructure/docker 目录）:
#   docker compose -f docker-compose.yml -f docker-compose.penpot.yml up -d
#
# 镜像版本锁定。插件入口在前端：PENPOT_FLAGS 必须包含 enable-feature-plugins。
# 前端容器监听 8080（映射到宿主机 9002）。官方 2.4.3 compose 同此端口。
# 参考: https://github.com/penpot/penpot/blob/2.4.3/docker/images/docker-compose.yaml

services:
  penpot-frontend:
    image: penpotapp/frontend:2.4.3
    ports:
      - "9002:8080"
    depends_on:
      - penpot-backend
      - penpot-exporter
    volumes:
      - penpot_assets:/opt/data/assets
    environment:
      PENPOT_FLAGS: disable-email-verification enable-registration enable-login-with-password enable-feature-plugins disable-secure-session-cookies
    networks:
      - canvory_net

  penpot-backend:
    image: penpotapp/backend:2.4.3
    depends_on:
      - postgres
      - redis
    volumes:
      - penpot_assets:/opt/data/assets
    environment:
      PENPOT_FLAGS: disable-email-verification enable-registration enable-login-with-password enable-feature-plugins disable-secure-session-cookies
      PENPOT_PUBLIC_URI: http://localhost:9002
      PENPOT_DATABASE_URI: postgresql://postgres/penpot
      PENPOT_DATABASE_USERNAME: canvory
      PENPOT_DATABASE_PASSWORD: canvory
      PENPOT_REDIS_URI: redis://redis/1
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SECRET_KEY: canvory-penpot-dev-only-not-for-production
    networks:
      - canvory_net

  penpot-exporter:
    image: penpotapp/exporter:2.4.3
    depends_on:
      - penpot-backend
    environment:
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://redis/1
    networks:
      - canvory_net

volumes:
  penpot_assets:

networks:
  canvory_net:
    driver: bridge
